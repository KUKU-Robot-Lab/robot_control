  # Ranges from the vendor driver package the real hand runs on
  # (ros_ws/src/dg5f_ros2/dg5f_description/urdf/dg5f_right_short.urdf).
  # 2026-09-14..09-23 they followed the Tesollo CAD release
  # (repo/tesollo/tesollo_model/dg5f/dg5f_right_short.urdf), which the training
  # asset is built from; the two tables differ on nine joints per hand
  # (thumb_1 upper 0.890 vs 1.344, pinky_2 upper 0.611 vs 1.571, ...). The
  # driver is what the real hand enforces, so it wins here; the plan is to port
  # it into the training URDF/USD later. They are not
  # symmetric: the thumb's second joint only travels negative and the other
  # fingers' only positive, so the +-1.5 placeholder these carried authorized a
  # curl command that drove four fingers into their stops. Velocity is held at
  # the arm's conservative 2.0 rather than the described 3.14, on the same
  # reasoning as the arm.
