name: rh56f1
# Inspire RH56F1, six linear actuators (lead screw + linkage, non-backdrivable) per hand, one hand per NIC.
# Canonical hand control contract — 2026-10-06 (updated from the RS485 snapshot of a35f8e9).
#
# Real hands run over EtherCAT (500 Hz PDO): sim2real deploy/policy_control rh56f1_ecat_node + the C master
# tools/ethercat/rh56f1_ecat_master (sim2real 0ddeb54 .. cd542da). ros_ws/src/inspire_rh56f1 here is kept for
# the rh56f1_interfaces messages and as the RS485/CANFD fallback only (a8328a1).
# Measurements behind the numbers: motion_acq docs/RH56F1_HAND_TUNING.md (both hands, 10.06).
status: ethercat_verified_admittance_untuned
command: {interface: position, unit: rad}
state: {position: rad, velocity: rad/s, effort: N*m}
driver:
  transport: ethercat            # rs485 / canfd: vendor fallback (ros_ws/src/inspire_rh56f1)
  units: {angle: 0.1deg, force: g, current: mA, speed: "0..4000 (2000 = full stroke in 1 s)", touch: 0.01N}
  # angle registers close downward: fingers 1740 open .. 900 closed (~550 reg/rad), thumb_2 1350 .. 1100
  # (~527 reg/rad), thumb_1 1473/1410 (left/right, away from the palm) .. 615/600 (across it); -1 = leave.
  slot_order: [pinky, ring, middle, index, thumb_2, thumb_1]
  # Two command inputs, same message and units. Every user (teleop, policies, pd, replay) picks one.
  command:
    position: {topic: /hand_<side>/angle_set, type: rh56f1_interfaces/msg/SetAngle1}
    admittance: {topic: /hand_<side>/angle_target, type: rh56f1_interfaces/msg/SetAngle1}
  state:
    angle: {topic: /hand_<side>/angle_actual, type: rh56f1_interfaces/msg/GetAngleAct1}
    force: {topic: /hand_<side>/force_actual, type: rh56f1_interfaces/msg/GetForceAct1}
    current: {topic: /hand_<side>/current_actual, type: rh56f1_interfaces/msg/GetCurrentAct1}
    touch: {topic: /hand_<side>/touch_data, type: rh56f1_interfaces/msg/TouchData1}
    status: {topic: /hand_<side>/ecat_status, type: std_msgs/msg/String}
    admittance_offset: {topic: /hand_<side>/admittance_offset, type: std_msgs/msg/Int32MultiArray}
safety: {watchdog_sec: 0.25, error_action: hold_last_safe_pose, estop: required}

# Written over SDO at driver start (PREOP) and read back; the driver refuses OP on a mismatch.
# SDO is refused while the hand is in OP (10.06: "mailbox protocol not supported") — start-time only.
protection:
  clear_error: true
  current_limit_ma: 800          # per actuator; 10.06 free motion <= 320 mA, 900 g grip 770-950 mA
  finger_mode: 0                 # 0 position. 1 force loop ignores the angle; 2 impedance is slow and trembles
  force_zero_calibration: on_request   # --force-calibrate, empty hand, 6 s (10.06 both hands: rest -> ~0 g)

# Measured hand behaviour (10.06, both hands, cup) — what a simulator must reproduce.
measured:
  force_sensor: actuator load as fingertip-equivalent g (link 1 contact = larger real force, manual 2.5.12)
  force_set_honoured_in_mode_0: false          # 300-1000 g set, 1.6-1.85 kg reached
  saturation_g: [1100, 1850]                   # mode 0, target far past the contact
  contact_stiffness_g_per_reg: [3, 55]         # object and link dependent; thumb_2 ~55, rigid cup ~100 at the tip
  speed_changes_overshoot: false               # 150..2000, unlike RH56DFX (arXiv 2603.08988)
  holds_force_with_zero_current: true          # lead screw
  mode_1_force_ratio: {fingers: 1.0, thumb_2: 0.64}
  thumb_1_force_sign: negative_under_outward_load

# Canonical per-finger admittance, applied by the driver at its cycle (500 Hz) to the axes commanded on
# angle_target. Reference implementation: robot_control.rh56f1_hand (Python); the sim2real C master must give
# the same numbers (sim2real test). Per axis and cycle, in registers (closing = smaller):
#   f   = max(force - rest - deadband_g, 0)   (/ proximal_scale while the fingertip reads < tip_on_counts)
#   y  += a (f / k_g_per_reg + max(f - f_max_g, 0) / k_over_g_per_reg - y),  a = dt / (tau + dt)
#         (in contact, unchanged while |f - k y| < hold_band_g)
#   cmd = target + y;  once f > rate_on_g the command restarts from the measured angle and closes at most
#         rate_reg_s (1 - f / f_max_g) per second (opening at once) until the force and the offset are gone;
#         above current_hold_ma it stops at the measured angle until the operator opens past it
# Free space: follows the target. Contact: grip ~ k x registers the target is past the contact.
control:
  admittance:
    k_g_per_reg: 3.6             # ~2000 g/rad on the fingers
    deadband_g: 40.0
    tau_contact_s: 0.3           # 10.06 evening trial (1.0: 0.5 rad/s operator overshot ~1.15 kg on a rigid cup); 0.5 s in a
                                 # 120 Hz outer loop with the old lead cap cycled 100-440 g
    tau_release_s: 0.15
    f_max_g: 800.0
    k_over_g_per_reg: 0.36
    rate_on_g: 60.0              # over the deadband: fast free-space closing reads 50-60 g (10.06), not contact
    rate_reg_s: 165.0            # ~0.3 rad/s x (1 - f / f_max). 10.06: a lead cap (11 reg vs measured) held a rigid cup at
                                 # ~350 g whatever the penetration (55 g per register past the finger); simulated with that
                                 # plant and 24-50 ms delay: no cycle, 0.4 rad -> 750-840 g, 0.5 rad/s approach peak < 900 g
    max_offset_reg: 880.0
    proximal_scale: 1.0          # 10.06 user (A): the grip follows the actuator reading wherever it touches; a link 1
                                 # contact then presses ~1/0.7 harder than a tip one (manual 2.5.12), 0.7 = per contact force
    tip_on_counts: 20.0          # 0.2 N
    hold_band_g: 200.0           # in contact, |f - k y| below this keeps y. 10.06 evening (tau 0.3): the hand answers a
                                 # closing command at 300 mA but a slightly opening one hardly at all (lead screw): mid grips
                                 # cycled 190-720 g with 100. Before that (10.06 right index + cup at 500 Hz), the
                                 # hand stepped 3-5 registers at a time and the force hunted 80 <-> 300 g without it
    current_hold_ma: 650.0       # in contact above this the command is pinned at the measured angle (the lead screw holds
                                 # the force at zero current). 10.06 all fingers: at ~800 g the current wound up 500 -> 1084 mA
                                 # with the command held past the blocked finger; the 800 mA SDO limit did not cap it
    joints: [1, 1, 1, 1, 1, 0]   # slot order; thumb_1 position only (force sign)
